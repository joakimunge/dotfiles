# ThePrimeagen-inspired tmux config
# Beginner-friendly setup for Mac

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (optional but helpful when learning)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable 256 colors
set -g default-terminal "screen-256color"

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Enable focus events (important for neovim)
set -g focus-events on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Easier splits (Swedish keyboard friendly!)
# Ctrl-a v for vertical split (v = vertical)
# Ctrl-a s for horizontal split (s = split)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vi mode for copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Don't exit copy mode when selecting with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status bar styling (minimal and clean)
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-left-length 40
set -g status-left '#[fg=green]#S #[fg=white]| '
set -g status-right '#[fg=yellow]%d %b %R'

# Active window styling
set -g window-status-current-style 'fg=black bg=#5eacd3'

# Pane border colors
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#5eacd3'

# Fuzzy-find a project and switch to its tmux session (prefix + f)
bind-key f run-shell "tmux neww tmux-sessionizer"
